# Synced from the cloud vault by the External Secrets Operator.
# The store (AWS Secrets Manager or Azure Key Vault) is chosen by the overlay.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-vault
  target:
    name: db-credentials
  data:
    - secretKey: SPRING_DATASOURCE_URL
      remoteRef: { key: prod-mortgage-db, property: url }
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: { key: prod-mortgage-db, property: username }
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: { key: prod-mortgage-db, property: password }
