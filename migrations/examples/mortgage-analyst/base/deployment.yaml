apiVersion: apps/v1
kind: Deployment
metadata:
  name: mortgage-analyst
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: mortgage-analyst }
  template:
    metadata:
      labels: { app: mortgage-analyst }
    spec:
      serviceAccountName: mortgage-analyst
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: mortgage-analyst }
      containers:
        - name: app
          image: mortgage-analyst
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - secretRef: { name: db-credentials }
          env:
            - { name: SPRING_LIQUIBASE_ENABLED, value: "false" }      # the PreSync Job owns migrations
            - { name: MORTGAGEARB_SCHEDULING_ENABLED, value: "false" } # CronJobs own scheduled work
            - { name: SERVER_SHUTDOWN, value: "graceful" }
            - { name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true" }
            - { name: TZ, value: "Europe/Madrid" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
