apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mortgage
labels:
  - pairs:
      app.kubernetes.io/name: mortgage-analyst
      app.kubernetes.io/part-of: portfolio
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - externalsecret.yaml
  - job-migrate.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - hpa.yaml
  - pdb.yaml
  - cronjob-euribor.yaml
# The image name stays "mortgage-analyst" here. Each overlay sets the registry and the tag.
