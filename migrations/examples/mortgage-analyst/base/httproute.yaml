apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mortgage-analyst
spec:
  parentRefs:
    - name: shared-gateway        # one Gateway per cluster, owned by the platform
      namespace: gateway-system
  hostnames:
    - hipotecas.example.com
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - { name: mortgage-analyst, port: 80 }
